name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, homelab]
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to lab-server
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.LAB_SERVER_HOST_KEY }}
        run: |
          # Locate the artifact directory and extract version
          ARTIFACT_DIR=$(ls -d poller-linux-amd64-sha-* 2>/dev/null | head -1)
          if [ -z "$ARTIFACT_DIR" ]; then
            echo "No poller artifact found" >&2
            exit 1
          fi
          VERSION=$(basename "$ARTIFACT_DIR" | sed 's/^poller-linux-amd64-//')
          chmod +x "$ARTIFACT_DIR/poller"

          # Set up SSH key and known hosts
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 0600 ~/.ssh/deploy_key
          echo "$HOST_KEY" >> ~/.ssh/known_hosts

          # Deploy: pipe binary via stdin; forced command on lab-server receives $VERSION
          ssh -i ~/.ssh/deploy_key -T \
            deploy@192.168.1.145 "$VERSION" < "$ARTIFACT_DIR/poller"

          # Clean up key from runner filesystem
          rm ~/.ssh/deploy_key
